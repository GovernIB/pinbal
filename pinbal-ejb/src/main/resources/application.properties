spring.datasource.jndi-name=java:jboss/datasources/pinbalDS
spring.mail.jndi-name=java:jboss/mail/PinbalSession

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.open-in-view=false

spring.liquibase.enabled=false
spring.liquibase.database-change-log-table=PBL_DATABASECHANGELOG
spring.liquibase.database-change-log-lock-table=PBL_DATABASECHANGELOGLOCK
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.labels=none

spring.cache.jcache.config=classpath:ehcache.xml

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration
