server.servlet.context-path=/pinbalback
server.error.path=/error
server.forward-headers-strategy=framework

spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.hbm2ddl.auto: validate
spring.jpa.properties.hibernate.show_sql: false
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.use_sql_comments: true

# spring.jpa.hibernate.naming-strategy=es.caib.pinbal.persist.audit.CustomPhysicalNamingStrategy
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
# spring.open-in-view: false

spring.mvc.view.prefix: /WEB-INF/jsp/
spring.mvc.view.suffix: .jsp

spring.freemarker.enabled: false
spring.messages.basename: messages

spring.servlet.multipart.enabled: true
spring.servlet.multipart.max-file-size: 50MB

spring.jackson.default-property-inclusion=non_null

# es.caib.pinbal.front.api.url=http://localhost:8080/pinbalback/apinew/

# spring.liquibase.enabled=true
# spring.liquibase.database-change-log-table=PBL_DATABASECHANGELOG
# spring.liquibase.database-change-log-lock-table=PBL_DATABASECHANGELOGLOCK
# spring.liquibase.change-log: classpath=/db/changelog/db.changelog-master.yaml
# spring.liquibase.labels=none

spring.cache.jcache.config=classpath:ehcache.xml
spring.jmx.enabled=true
spring.management.endpoints.jmx.exposure.include="*"
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration
