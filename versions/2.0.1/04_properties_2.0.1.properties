# Propietats noves per al logout complet contra Keycloak sota JBoss
# (UsuariController.logout()): mateixos valors que ja teniu configurats per
# al subsistema keycloak de standalone-openshift.xml (JBOSS_AUTH_URL /
# JBOSS_AUTH_REALM / JBOSS_AUTH_CLIENTID).
es.caib.pinbal.auth.url=https://SERVIDOR_KEYCLOAK/
es.caib.pinbal.auth.realm=REALM_KEYCLOAK
es.caib.pinbal.auth.clientid=CLIENT_ID_KEYCLOAK
