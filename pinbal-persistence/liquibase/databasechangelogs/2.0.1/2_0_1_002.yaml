- changeSet:
      id: rename-acl-class-procediment-servei
      author: Limit
      comment: Actualitza el nom de classe de ProcedimentServei a pbl_acl_class (repaquet core.model -> persist.entity durant migració Spring 3)
      changes:
          - update:
                tableName: pbl_acl_class
                columns:
                    - column:
                          name: class
                          value: 'es.caib.pinbal.persist.entity.ProcedimentServei'
                where: class = 'es.caib.pinbal.core.model.ProcedimentServei'
      rollback:
          - update:
                tableName: pbl_acl_class
                columns:
                    - column:
                          name: class
                          value: 'es.caib.pinbal.core.model.ProcedimentServei'
                where: class = 'es.caib.pinbal.persist.entity.ProcedimentServei'
