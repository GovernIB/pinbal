- changeSet:
    id: 1781195289665-32
    author: sionandreu (generated)
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: CORE_PETICION_RESPUESTA_PK
            name: IDPETICION
            remarks: Identificador unívoco de la petición de servicio
            type: VARCHAR2(26 CHAR)
        - column:
            constraints:
              nullable: false
            name: CERTIFICADO
            type: NUMBER(38, 0)
        - column:
            constraints:
              nullable: false
            name: ESTADO
            remarks: Codigo identificativo del estado de la petición. Tomará sus valores
              de las tablas scsp_estado_peticion y scsp_codigo_error
            type: VARCHAR2(4 CHAR)
        - column:
            name: ESTADOSECUNDARIO
            type: VARCHAR2(16 CHAR)
        - column:
            name: FECHAPETICION
            remarks: Timestamp que indica la fecha en la que se generó la petición
            type: TIMESTAMP(6)
        - column:
            name: FECHARESPUESTA
            remarks: Timestamp que indica la fecha en la cual se recibió la respuesta
              a nuestra petición
            type: TIMESTAMP(6)
        - column:
            name: TER
            remarks: Timestamp que indica la fecha a partir de la cual una petición
              de tipo asíncrono podrá solicitar una respuesta definitiva al servicio
            type: TIMESTAMP(6)
        - column:
            constraints:
              nullable: false
            defaultValueNumeric: !!float '0'
            name: NUMEROENVIOS
            remarks: Valor que indica el número de veces que se ha reenviado una petición
              al servicio
            type: NUMBER
        - column:
            constraints:
              nullable: false
            defaultValueNumeric: !!float '1'
            name: NUMEROTRANSMISIONES
            remarks: Número de Solicitudes de Transmisión que se enviaron en la petición
            type: NUMBER
        - column:
            name: FECHAULTIMOSONDEO
            remarks: Timestamp que indica la fecha del último reenvio de una petición
              de tipo asincrono
            type: TIMESTAMP(6)
        - column:
            constraints:
              nullable: false
            defaultValueNumeric: !!float '1'
            name: TRANSMISIONSINCRONA
            remarks: 'Valor binario que indica si la petición fue solicitada a un
              servicio de tipo síncrono o asincrono. Podrá tomar los valores: 0: La
              comunicación fue de tipo asíncrono, 1: La comunicación fue de tipo síncrono'
            type: NUMBER
        - column:
            name: DESCOMPUESTA
            remarks: 'Caracter que indica el estado del procesamiento de las transmisiones
              de la respuesta recibida. Podrá tomar los siguientes valores:    - S:
              Se ha procesado correctamente la respuesta, habiendo obtenido todas
              las transmisiones en ella incluidas y registradas en la tabla core_transmision.
              - N: No ha sido procesadas las transmisiones de la respuesta. - E: La
              respuesta terminó correctamente  (estado 0003), pero se ha producido
              un error al procesar sus trasmisiones'
            type: VARCHAR2(1 CHAR)
        - column:
            name: ERROR
            type: VARCHAR2(4000 CHAR)
        - column:
            name: ERRORSECUNDARIO
            type: VARCHAR2(1024 CHAR)
        remarks: Esta tabla registrará un histórico de las peticiones y respuestas
          intercambiadas entre los requirentes y los emisores de servicios
        tableName: CORE_PETICION_RESPUESTA
        tablespace: USERS
