databaseChangeLog:
- changeSet:
    id: init-trigger-1
    author: Limit
    comment: Inicialitzar triggers
    changes:
    - sql:
        dbms: oracle
        splitStatements: false
        sql: "CREATE OR REPLACE TRIGGER pbl_acl_sid_idgen
BEFORE INSERT ON pbl_acl_sid
FOR EACH ROW
WHEN (NEW.ID IS NULL)
  BEGIN
    SELECT pbl_acl_sid_seq.NEXTVAL INTO :NEW.ID FROM DUAL;
  END;"
    - sql:
        dbms: oracle
        splitStatements: false
        sql: "CREATE OR REPLACE TRIGGER pbl_acl_class_idgen
