databaseChangeLog:
# Bessó de 04_h2_drop_sslflag.yaml (vegeu-ne el comentari per al detall
# complet) per al mateix problema, pero contra una instancia d'Oracle
# efimera nova (scripts/e2e/run-e2e.sh --db=oracle): la migracio manual real
# (versions/2.0.1/01_update_scsp_PRE.sql) que fa el DROP COLUMN SSLFLAG
# nomes s'aplica a mà contra un Oracle real EXISTENT (no forma part de la
# cadena de canvis de Liquibase), aixi que mai s'executa contra una BD
# Oracle nova creada nomes amb Liquibase - resultat identic al d'H2:
# "NULL not allowed"/ORA-01400 activant/desactivant un servei per entitat.
#
# Restringit a "context: e2e" (no "dbms: oracle" sol, que tambe afectaria
# qualsevol Oracle real/existent - vegeu docker-compose.e2e-oracle.yml,
# on aquest context nomes s'activa per a aquest flux efimer): contra un
# Oracle real, aquesta columna ja no existeix (eliminada per la migracio
# manual), i tornar a intentar el DROP hi fallaria.
- changeSet:
    id: e2e-oracle-drop-sslflag
    author: Limit
    dbms: oracle
    context: e2e
    changes:
    - dropColumn:
        tableName: core_req_cesionarios_servicios
        columnName: sslflag
