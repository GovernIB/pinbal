databaseChangeLog:
- changeSet:
    id: 2.0.1-add-usuari-app-guarda-just-arx
    author: Limit
    comment: Afegir la columna app_guarda_just_arx a la taula d'usuaris.
    changes:
    - addColumn:
        tableName: pbl_usuari
        columns:
        - column:
            name: app_guarda_just_arx
            type: NUMBER(1,0)
            defaultValueNumeric: 0
            constraints:
              nullable: false
- changeSet:
    id: 2.0.1-init-usuari-app-guarda-just-arx-aplicacio
    author: Limit
    comment: Per defecte, els usuaris amb rol aplicació gestionen ells mateixos el justificant (app_guarda_just_arx = 1).
    changes:
    - sql:
        sql: UPDATE pbl_usuari SET app_guarda_just_arx = 1 WHERE codi IN (SELECT eu.usuari_id FROM pbl_entitat_usuari eu WHERE eu.aplicacio = 1)
