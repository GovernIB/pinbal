databaseChangeLog:
- changeSet:
    id: 2.0.1-cleanup-orphan-claveprivada-reqcesionaris-servicis
    author: Limit
    comment: Sanejament de les dades existents abans d'afegir una FK a a clau privada de la taula de serveis cessionaris, perquè no hi hagi cap referència orfa.
    changes:
    - sql:
        sql: >-
          UPDATE core_req_cesionarios_servicios
          SET claveprivada = NULL
          WHERE claveprivada IS NOT NULL
          AND claveprivada NOT IN (SELECT id FROM core_clave_privada)
- changeSet:
    id: 2.0.1-fk-clave-privada-reqcesionaris-servicis
    author: Limit
    comment: Afegeix la FK de la clau privada a la taula de serveis cessionaris.
    changes:
    - addForeignKeyConstraint:
        baseTableName: core_req_cesionarios_servicios
        baseColumnNames: claveprivada
        constraintName: fk_clave_priv_reqcesionaris
        referencedTableName: core_clave_privada
        referencedColumnNames: id
        onDelete: SET NULL
