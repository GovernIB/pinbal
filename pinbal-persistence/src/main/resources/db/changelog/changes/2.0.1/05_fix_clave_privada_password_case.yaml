databaseChangeLog:
# init/01_initial_schema_table.yaml crea core_clave_privada.password sense
# cap indicació de quoting explícita al YAML, pero Liquibase detecta
# "password" com a paraula reservada (segons la seva pròpia llista interna,
# independent de si Oracle mateix la tracta com a tal) i genera el DDL amb
# l'identificador entre cometes ("password"), preservant minúscules — a
# diferència de la resta de columnes de la mateixa taula (id, alias, nombre,
# etc.), que no es quoten i acaben en majúscules com és habitual a Oracle.
# Resultat: la columna real es diu literalment "password" (minúscules,
# case-sensitive), pero qualsevol referència NO quotada (com les que genera
# Hibernate, p.ex. "clavepriva4_.password") l'Oracle la interpreta com a
# PASSWORD (majúscules) - que no existeix -> ORA-00904 "invalid identifier"
# a QUALSEVOL consulta que toqui aquesta columna (reproduit amb desenes
# d'aparicions diferents al log carregant claus privades des de diversos
# punts de l'aplicacio).
#
# No es toca init/01_initial_schema_table.yaml (ja aplicat en entorns reals
# existents) sino que es renombra la columna al seu nom "normal" (majuscules,
# sense quotes) amb un canvi nou, coherent amb com Hibernate ja la referencia
# sempre.
- changeSet:
    id: fix-clave-privada-password-case
    author: Limit
    dbms: oracle
    comment: >-
      Renombra core_clave_privada."password" (minuscules, quotada per Liquibase
      en crear-la per ser una paraula que considera reservada) a PASSWORD
      (majuscules, sense quotes) perque coincideixi amb com Hibernate hi fa
      referencia sempre (sense quotes) - vegeu ORA-00904 "invalid identifier"
      reproduit en qualsevol consulta sobre ClavePrivada.
    changes:
    - sql:
        dbms: oracle
        sql: ALTER TABLE core_clave_privada RENAME COLUMN "password" TO PASSWORD
