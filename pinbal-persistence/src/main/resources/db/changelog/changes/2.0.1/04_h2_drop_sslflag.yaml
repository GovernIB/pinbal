databaseChangeLog:
- changeSet:
    id: 2.0.1-h2-drop-sslflag
    author: Limit
    dbms: h2
    comment: >-
      La migracio manual real (versions/2.0.1/01_update_scsp_PRE.sql,
      "UpdateRequirente-4.25.0 a 4.28.0") migra les files amb SSLFLAG=1 cap
      a la taula nova core_req_ssl_cesionarios i tot seguit fa
      "ALTER TABLE CORE_REQ_CESIONARIOS_SERVICIOS DROP COLUMN SSLFLAG".
      Aquesta migracio es aplica a mà contra Oracle (versions/ no forma part
      de la cadena de canvis de Liquibase), pero la columna sslflag encara
      existeix (NOT NULL, sense default) a la baseline d'aquest repositori,
      i l'entitat de tercers es.scsp.common.domain.req.ServicioOrganismoCesionario
      no la mapeja (coincideix amb l'esquema POST-migracio). Resultat: sota
      H2, activar/desactivar un servei per a una entitat
      (EntitatServiceImpl -> ScspHelper -> ServicioOrganismoCesionarioDao.save)
      falla amb "NULL not allowed for column SSLFLAG". Com que aqui no hi ha
      dades existents a migrar (esquema H2 sempre nou), nomes cal el DROP.
    changes:
    - dropColumn:
        tableName: core_req_cesionarios_servicios
        columnName: sslflag
