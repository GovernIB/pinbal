databaseChangeLog:
# Dades de prova per al domini "Servei" SCSP per als tests Playwright d'e2e.
#
# Igual que 00_e2e_seed_data.yaml, nomes s'executa contra H2 (dbms: h2 a cada
# changeSet) i reserva el rang d'id 900000-909999.
#
# Un "servei" consultable via SCSP es en realitat la unio de:
#  - core_servicio (taula legacy SCSP, clau primaria numerica `id`, codi de
#    negoci unic `codcertificado`)
#  - pbl_servei_config (companya 1:1, clau primaria propia `id`, FK
#    `servei_id` VARCHAR2(256) que guarda el `codcertificado`, NO una FK
#    numerica a core_servicio.id — confirmat a
#    pinbal-persistence/src/main/resources/db/changelog/init/01_initial_schema_table.yaml
#    i 02_initial_schema_constraint.yaml, on nomes core_servicio.emisor,
#    clavefirma i clavecifrado tenen FK numerica declarada; pbl_servei_config,
#    pbl_entitat_servei i pbl_procediment_servei enllacen amb core_servicio
#    nomes per codi, sense FK de BD)
#
# Els 4 primers codis (Q2827003ATGSS001, SCDCPAJU, SVDDGTVEHICULOSANCWS01,
# SVDDGPCIWS02) son els unics dels quals el servidor pinbal-scsp-fake te
# exemples de resposta reals carregats (vegeu
# pinbal-scsp-fake/src/main/resources/xml_peticions.txt i FAKE_SCSP_SERVER.md).
# Les seves urlsincrona/urlasincrona apunten al fake amb el mateix patro que
# scripts/scsp-fake/point-to-fake.sql: ${fakeScspBaseUrl}/servicios/<codi>/(a)sincrona.
#
# La resta de columnes NOT NULL de core_servicio (versionesquema,
# tiposeguridad, numeromaximoreenvios, maxsolicitudespeticion, fechaalta,
# caducidad, timeout, validacionfirma quan aplica) estan copiades de files
# reals de producció trobades a scripts/bbdd/1.4.41/05_pinbal_serveis.sql
# (INSERT INTO core_servicio ... codcertificado='Q2827003ATGSS001'/'SCDCPAJU'/
# 'SVDDGTVEHICULOSANCWS01'/'SVDDGPCIWS02'), nomes canviant emisor (aqui
# 900401, l'emissor sembrat a 00_e2e_seed_data.yaml) i les urls.
- changeSet:
    id: e2e-seed-servicios-scsp-fake
    author: Limit
    dbms: h2
    comment: >-
      core_servicio pels 4 serveis SCSP que el servidor pinbal-scsp-fake sap
      respondre. Valors de columnes obligatories copiats de files reals de
      producció (scripts/bbdd/1.4.41/05_pinbal_serveis.sql).
    changes:
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900701 }
        - column: { name: codcertificado, value: Q2827003ATGSS001 }
        - column: { name: descripcion, value: "Estar al corriente de pago con la Seguridad Social" }
        - column: { name: urlsincrona, value: "${fakeScspBaseUrl}/servicios/Q2827003ATGSS001/sincrona" }
        - column: { name: urlasincrona, value: "${fakeScspBaseUrl}/servicios/Q2827003ATGSS001/asincrona" }
        - column: { name: actionsincrona, value: peticionSincrona }
        - column: { name: actionasincrona, value: peticionAsincrona }
        - column: { name: actionsolicitud, value: solicitudRespuesta }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: WS-Security }
        - column: { name: xpathcifradosincrono, value: "//*[local-name()='DatosEspecificos']" }
        - column: { name: esquemas, value: /schemas/Q2827003ATGSS001v3 }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 60 }
        - column: { name: validacionfirma, value: estricto }
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900702 }
        - column: { name: codcertificado, value: SCDCPAJU }
        - column: { name: descripcion, value: "Servei de consulta de padró de convivència" }
        - column: { name: urlsincrona, value: "${fakeScspBaseUrl}/servicios/SCDCPAJU/sincrona" }
        - column: { name: urlasincrona, value: "${fakeScspBaseUrl}/servicios/SCDCPAJU/asincrona" }
        - column: { name: actionsincrona, value: PeticionSincrona }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: XMLSignature }
        - column: { name: prefijopeticion, value: PINPRE }
        - column: { name: esquemas, value: /schemas/SCDCPAJUv3 }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 0 }
        # validacionfirma NULL a la fila real de producció d'aquest servei: no s'inclou.
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900703 }
        - column: { name: codcertificado, value: SVDDGTVEHICULOSANCWS01 }
        - column: { name: descripcion, value: "Consulta de datos de vehículos para sanciones." }
        - column: { name: urlsincrona, value: "${fakeScspBaseUrl}/servicios/SVDDGTVEHICULOSANCWS01/sincrona" }
        - column: { name: urlasincrona, value: "${fakeScspBaseUrl}/servicios/SVDDGTVEHICULOSANCWS01/asincrona" }
        - column: { name: actionsincrona, value: peticionSincrona }
        - column: { name: actionasincrona, value: peticionAsincrona }
        - column: { name: actionsolicitud, value: solicitudRespuesta }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: WS-Security }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 0 }
        # validacionfirma NULL a la fila real de producció d'aquest servei: no s'inclou.
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900704 }
        - column: { name: codcertificado, value: SVDDGPCIWS02 }
        - column: { name: descripcion, value: "Consulta de datos de identidad" }
        - column: { name: urlsincrona, value: "${fakeScspBaseUrl}/servicios/SVDDGPCIWS02/sincrona" }
        - column: { name: urlasincrona, value: "${fakeScspBaseUrl}/servicios/SVDDGPCIWS02/asincrona" }
        - column: { name: actionsincrona, value: peticionSincrona }
        - column: { name: actionasincrona, value: peticionAsincrona }
        - column: { name: actionsolicitud, value: solicitudRespuesta }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: WS-Security }
        - column: { name: esquemas, value: /schemas/SVDDGPCIWS02v3 }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 0 }
        - column: { name: validacionfirma, value: estricto }

- changeSet:
    id: e2e-seed-servicios-crud
    author: Limit
    dbms: h2
    comment: >-
      Parell addicional de core_servicio/pbl_servei_config NO cobert pel fake
      SCSP (codis inventats), nomes per als tests de CRUD/llistat/filtre
      d'"Administrador > Gestionar > Serveis" que no arriben a invocar SCSP.
      urlsincrona/urlasincrona son placeholders (mai s'invoquen). Els valors
      d'enum reutilitzats (versionesquema=V3, tiposeguridad=WS-Security) son
      valors reals vistos a la resta de serveis d'aquest fitxer, no una
      invenció; s'apliquen aqui nomes per tenir un servei "generic" sense cap
      integracio SCSP real al darrere.
    changes:
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900705 }
        - column: { name: codcertificado, value: E2ESERV01 }
        - column: { name: descripcion, value: "Servei E2E CRUD U (actiu)" }
        - column: { name: urlsincrona, value: "https://e2e-placeholder.invalid/servicios/E2ESERV01/sincrona" }
        - column: { name: urlasincrona, value: "https://e2e-placeholder.invalid/servicios/E2ESERV01/asincrona" }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: WS-Security }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 0 }
    - insert:
        tableName: core_servicio
        columns:
        - column: { name: id, valueNumeric: 900706 }
        - column: { name: codcertificado, value: E2ESERV02 }
        - column: { name: descripcion, value: "Servei E2E CRUD Dos (donat de baixa)" }
        - column: { name: urlsincrona, value: "https://e2e-placeholder.invalid/servicios/E2ESERV02/sincrona" }
        - column: { name: urlasincrona, value: "https://e2e-placeholder.invalid/servicios/E2ESERV02/asincrona" }
        - column: { name: versionesquema, value: V3 }
        - column: { name: tiposeguridad, value: WS-Security }
        - column: { name: numeromaximoreenvios, valueNumeric: 0 }
        - column: { name: maxsolicitudespeticion, valueNumeric: 0 }
        - column: { name: emisor, valueNumeric: 900401 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: fechabaja, valueDate: 2024-06-01T00:00:00 }
        - column: { name: caducidad, valueNumeric: 0 }
        - column: { name: timeout, valueNumeric: 0 }

- changeSet:
    id: e2e-seed-servei-config
    author: Limit
    dbms: h2
    comment: >-
      pbl_servei_config, una fila per cada core_servicio d'aquest fitxer
      (enllaçada per servei_id=codcertificado, sense FK de BD). Els flags
      booleans es copien tal qual d'una fila real de producció
      (PBL_SERVEI_CONFIG.id=1029, servei Q2827003ATGSS001, a
      scripts/bbdd/1.4.41/05_pinbal_serveis.sql): comprovar_document=1,
      permes_doctip_{dni,nie,nif,cif,pas}=1, document_obligatori=1,
      unitat_dir3_from_entitat=0, enviar_solicitant=0, actiu=1. S'apliquen de
      manera uniforme als 6 serveis per tenir un conjunt de dades consistent
      (servei actiu, simple, sense adjunts obligatoris addicionals, que
      permet DNI/NIE/NIF/CIF); l'unica variacio intencionada es
      E2ESERV02.actiu=0, per tenir un cas de servei inactiu per als tests de
      llistat/filtre.
