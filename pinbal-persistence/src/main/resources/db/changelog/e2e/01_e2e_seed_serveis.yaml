- changeSet:
    id: e2e-seed-consultes-realitzades-llistat
    author: Limit
    dbms: h2
    preConditions:
        onFail: MARK_RAN
        not:
            changeLogPropertyDefined:
                property: e2eDelegatUsername
                value: ''
    comment: >-
      pbl_consulta_list es una taula desnormalitzada, separada de
      pbl_consulta, que es la que llegeixen TOTES les pantalles de llistat
      de consultes (administrador i delegat/representant, veure
      LlistatConsultaRepository). En produccio (Oracle) es manté sincronitzada
      per codi/mecanisme extern a aquest repositori (no s'ha trobat cap
      trigger ni codi Java que hi escrigui: nomes hi ha un backfill puntual
      historic a versions/1.4.41/02_update_dml_1.4.41.sql). Com que aqui
      sembrem pbl_consulta directament via SQL (sense passar per la UI),
      cal fer el mateix backfill manualment, replicant exactament la
      mateixa logica de mapeig d'aquell script per als 6 registres sembrats
      al changeset anterior. Sense aixo, tant el llistat d'administrador com
      el de delegat mostren sempre 0 resultats encara que pbl_consulta tingui
      dades (recordsTotal:0 al datatable, confirmat per depuracio directa).
    changes:
    - sql:
        sql: >-
          INSERT INTO pbl_consulta_list (
            id, peticioid, solicitudid, data, departament, recobriment,
            multiple, usuaricodi, usuarinom, funcionarinom, funcionarinif,
            titularnom, titulardoctip, titulardocnum, procedimentid,
            procedimentcodi, procedimentnom, serveicodi, serveinom, estat,
            error, justificantestat, justificanterror, entitatid, entitatcodi, pareid
          )
          SELECT
            c.id,
            c.peticion_id,
            COALESCE(c.solicitud_id, c.peticion_id),
            c.createddate,
            c.departament,
            COALESCE(c.recobriment, 0),
            COALESCE(c.multiple, 0),
            c.createdby_codi,
            u.nom,
            c.funcionari_nom,
            c.funcionari_docnum,
            COALESCE(c.titular_nomcomplet, ''),
            COALESCE(c.titular_doctip, 'NIF'),
            COALESCE(c.titular_docnum, ''),
            p.id,
            p.codi,
            p.nom,
            c.servei_codi,
            s.descripcion,
            CASE WHEN c.estat = 0 THEN 'Pendent' WHEN c.estat = 1 THEN 'Processant' WHEN c.estat = 2 THEN 'Tramitada' WHEN c.estat = 3 THEN 'Error' WHEN c.estat = 4 THEN 'Encua' END,
            c.error,
            CASE WHEN c.justificant_estat = 0 THEN 'PENDENT' WHEN c.justificant_estat = 1 THEN 'OK' WHEN c.justificant_estat = 2 THEN 'ERROR' WHEN c.justificant_estat = 3 THEN 'NO_DISPONIBLE' WHEN c.justificant_estat = 4 THEN 'OK_NO_CUSTODIA' END,
            c.justificant_error,
            c.entitat_id,
            e.codi,
            c.pare_id
          FROM pbl_consulta c
          LEFT OUTER JOIN pbl_entitat e ON c.entitat_id = e.id
          LEFT OUTER JOIN pbl_procediment p ON c.procediment_id = p.id
          LEFT OUTER JOIN core_servicio s ON c.servei_codi = s.codcertificado
          LEFT OUTER JOIN pbl_usuari u ON c.createdby_codi = u.codi
          WHERE c.id IN (901401, 901402, 901403, 901410, 901411, 901412)
