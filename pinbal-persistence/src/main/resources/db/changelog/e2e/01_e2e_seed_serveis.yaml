    dbms: h2
    preConditions:
        onFail: MARK_RAN
        not:
            changeLogPropertyDefined:
                property: e2eDelegatUsername
                value: ''
    comment: >-
      Sense aixo, ProcedimentServiceImpl.findActiusAmbEntitatIServeiCodi
      (invocat en carregar consulta/{servei}/new) filtra els
      ProcedimentServei per PermisosHelper.filterGrantedAll(..., READ,
      aclService, auth): sense cap fila ACL concedint permis READ sobre
      l'objecte concret, el metode retorna llista buida encara que la
      relacio procediment-servei existeixi (#procedimentId es renderitza
      sense cap <option>). Es reprodueix exactament el que fa
      PermisosHelper.assignarPermisUsuari(usuariCodi, ProcedimentServei.class,
      id, BasePermission.READ, aclService) quan es fa des de la UI real
      (ProcedimentServiceImpl.serveiPermisAllow): class_id_type =
      java.lang.Long (Long.getCanonicalName(), vegeu
      org.springframework.security.acls.jdbc.JdbcMutableAclService.
      createOrRetrieveClassPrimaryKey), sid = el codi d'usuari amb
      principal=true (PrincipalSid), mask=1 (BasePermission.READ).
