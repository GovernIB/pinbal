    - insert:
        tableName: pbl_acl_class
        columns:
        - column: { name: id, valueNumeric: 901301 }
        - column: { name: class, value: es.caib.pinbal.persist.entity.ProcedimentServei }
        - column: { name: class_id_type, value: java.lang.Long }
