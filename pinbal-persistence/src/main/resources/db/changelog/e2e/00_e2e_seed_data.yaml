- changeSet:
    id: e2e-seed-explotacio-ahir
    author: Limit
    context: e2e
    comment: >-
      Snapshot buit (nomes pbl_explot_temps, sense fets) per a "ahir" respecte
      al moment en que s'inicialitza la BD. ConsultaServiceImpl.getExplotTempsEntity
      fa servir "ahir" com a dataFi per defecte quan la pantalla d'estadistiques
      es carrega sense cap filtre explicit (primer GET a /estadistiques, i el GET
      que segueix el redirect de /estadistiques/canviEntitat): si no troba cap
      snapshot per a aquesta data, dispara en calent generarDadesExplotacio
      (lent i no determinista, pensat per a un job batch). Sembrar aquest
      snapshot buit fa que la consulta trobi una fila existent i mai arribi a
      disparar aquell job durant els tests, sense alterar els totals sembrats
      a e2e-seed-explotacio (cap fet apunta a aquest temps_id).
    changes:
    - insert:
        tableName: pbl_explot_temps
        columns:
        - column: { name: id, valueNumeric: 900604 }
        - column: { name: data, valueComputed: "CURRENT_DATE - 1" }
        - column: { name: anualitat, valueComputed: "EXTRACT(YEAR FROM CURRENT_DATE - 1)" }

