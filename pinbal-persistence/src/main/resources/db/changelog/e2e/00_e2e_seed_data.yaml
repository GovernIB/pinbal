      Propietats de prova de diferents tipus. source_property='DATABASE' es
      el que fa que una propietat sigui editable des de la UI (vegeu
      PinbalPropertySourceLoader.SQL_LOAD_DB_PROPS a pinbal-service); qualsevol
      altre valor de source_property la fa nomes de lectura.
    changes:
    - insert:
        tableName: pbl_config
        columns:
        - column: { name: KEY, value: e2e.test.editable.text }
        - column: { name: VALUE, value: "valor editable" }
