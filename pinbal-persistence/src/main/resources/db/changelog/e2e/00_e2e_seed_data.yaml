- changeSet:
    id: e2e-seed-usuari-permisos
    author: Limit
    context: e2e
    comment: >-
        Usuari EXCLUSIU per al test "Permisos" de representant/usuaris.spec.ts
        (afegir/denegar/esborrar seleccionats/esborrar TOTS els permisos
        procediment-servei). Deliberadament NO es el mateix que
        e2eUserActiuUsername: aquell tambe l'usa representant/procediments.spec.ts
        per concedir-hi un permis (screen diferent, "Gestio de serveis d'un
        procediment"), i com que "esborrar tots els permisos" d'aquest test
        es una accio GLOBAL per usuari (esborra QUALSEVOL permis seu,
        no nomes els que ha creat aquest test), compartir l'usuari amb un
        altre fitxer que grava/esborra permisos concurrentment (Playwright
        executa fitxers en paral·lel per defecte) provoca una condicio de
        carrera real i observada: el recompte esperat no quadra, o pitjor,
        "esborrar tots" esborra el permis que l'altre test acaba de crear.
    changes:
    - insert:
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: E2E_USER_PERMISOS }
        - column: { name: nom, value: "Usuari E2E Permisos" }
        - column: { name: nif, value: "00000009S" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }
    - insert:
        tableName: pbl_entitat_usuari
        columns:
        - column: { name: id, valueNumeric: 900107 }
        - column: { name: entitat_id, valueNumeric: 900001 }
        - column: { name: usuari_id, value: E2E_USER_PERMISOS }
        - column: { name: delegat, valueNumeric: 1 }
        - column: { name: representant, valueNumeric: 0 }
        - column: { name: auditor, valueNumeric: 0 }
        - column: { name: aplicacio, valueNumeric: 0 }
        - column: { name: principal, valueNumeric: 0 }
        - column: { name: actiu, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }

