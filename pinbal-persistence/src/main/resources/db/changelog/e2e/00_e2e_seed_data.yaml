databaseChangeLog:
# Dades de demo/test per als tests Playwright d'e2e (scripts/e2e/run-e2e.sh).
#
# Només s'executa quan el context Liquibase "e2e" està actiu (context: e2e a
# cada changeSet; vegeu docker-compose.e2e.yml i docker-compose.e2e-oracle.yml),
# independentment del motor de BD (H2 o Oracle) — mai contra un entorn normal
# (dev/producció), on aquest context mai s'activa. Els usuaris de rol (delegat/representant/
# auditor) es vinculen, via paràmetres de cadena de connexió de Liquibase
# (e2eDelegatUsername, e2eRepresentantUsername, e2eAuditorUsername), als
# comptes reals ja configurats a Keycloak i a
# pinbal-back/src/main/reactapp/pinbal-back/e2e/.env.e2e — Keycloak es manté
# extern, aquí només es crea la fila corresponent a PBL_USUARI/PBL_ENTITAT_USUARI.
# L'"administrador" no necessita cap fila pròpia: PBL_ADMIN és un rol de realm
# de Keycloak sense contrapartida a la taula d'usuaris de domini.
#
# Totes les files sembrades reserven el rang d'id 900000-909999 per evitar
# col·lisions amb els ids que generin en calent les seqüències/hibernate en
# executar els tests (creació d'entitats, procediments, etc. via UI).
- changeSet:
    id: e2e-seed-organisme-cessionari
    author: Limit
    context: e2e
    comment: >-
      Organisme cessionari de prova. Necessari perque ClauPrivadaCommand.organismeId
      es @NotNull: sense cap fila aqui no es pot crear cap clau privada nova
      des de la UI (el select #organismeId quedaria buit).
    changes:
    - insert:
        tableName: core_organismo_cesionario
        columns:
        - column: { name: id, valueNumeric: 900011 }
        - column: { name: fechaalta, valueDate: 2024-01-01T00:00:00 }
        - column: { name: nombre, value: "Organisme Cessionari E2E" }
        - column: { name: cif, value: P0700000A }
        - column: { name: bloqueado, valueNumeric: 0 }

- changeSet:
    id: e2e-seed-entitats
    author: Limit
    context: e2e
    comment: Entitats de prova per als tests Playwright
    changes:
    - insert:
        tableName: pbl_entitat
        columns:
        - column: { name: id, valueNumeric: 900001 }
        - column: { name: codi, value: E2EENT01 }
        - column: { name: nom, value: "Entitat E2E Principal" }
        - column: { name: responsable, value: "Responsable E2E" }
        - column: { name: cif, value: P0700000A }
        - column: { name: tipus, valueNumeric: 1 }
        - column: { name: activa, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }
    - insert:
        tableName: pbl_entitat
        columns:
        - column: { name: id, valueNumeric: 900002 }
        - column: { name: codi, value: E2EENT02 }
        - column: { name: nom, value: "Entitat E2E Inactiva" }
        - column: { name: responsable, value: "Responsable E2E" }
        - column: { name: cif, value: P0700000B }
        - column: { name: tipus, valueNumeric: 1 }
        - column: { name: activa, valueNumeric: 0 }
        - column: { name: version, valueNumeric: 0 }

- changeSet:
    id: e2e-seed-usuaris-fixos
    author: Limit
    context: e2e
    comment: >-
      Usuaris addicionals (no lligats a un compte Keycloak concret, per aixo
      no calen preConditions com per admin/delegat/representant/auditor) per
      a proves de llistat/CRUD/permisos i per a l'us manual de l'aplicacio.
      Els codis son configurables des de e2e/.env.e2e
      (E2E_USER_ACTIU_USERNAME, E2E_USER_INACTIU_USERNAME,
      E2E_USER_ALL_ROLES; vegeu docker-compose.e2e.yml pels parametres de
      Liquibase corresponents), amb els mateixos valors per defecte que
      e2e/utils/env.ts si es deixen en blanc.
    changes:
    - insert:
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: "${e2eUserActiuUsername}" }
        - column: { name: nom, value: "Usuari E2E Actiu" }
        - column: { name: nif, value: "00000005M" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }
    - insert:
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: "${e2eUserInactiuUsername}" }
        - column: { name: nom, value: "Usuari E2E Inactiu" }
        - column: { name: nif, value: "00000006Y" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }
    - insert:
        # Usuari ja inicialitzat a pbl_usuari (evita el plugin ajax de cerca,
        # trencat en aquest entorn, vegeu representant/usuaris.spec.ts) però
        # SENSE cap fila pbl_entitat_usuari: a diferència
        # d'ACTIU/INACTIU/ALL_ROLES (que ja estan vinculats a l'entitat E2E
        # perquè els necessiten els tests de llistat/filtre), aquest queda
        # lliure per als tests que fan "Crear/afegir" un usuari nou a
        # l'entitat sense xocar amb un vincle ja existent.
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: E2E_USER_SENSE_ENTITAT }
        - column: { name: nom, value: "Usuari E2E Sense Entitat" }
        - column: { name: nif, value: "00000007F" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }
    - insert:
        # Compte fet servir per a proves manuals (no per l'automatitzacio de
        # Playwright), amb els tres rols d'entitat actius (vegeu
        # e2e-seed-entitat-usuari-fixos mes avall). UsuariHelper.init() cal
        # que trobi la fila PBL_USUARI perque no peti en iniciar sessio
        # (vegeu comentari mes avall sobre per que cal aixo per a tot usuari
        # autenticat, no nomes els de rol).
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: "${e2eUserAllRolesUsername}" }
        - column: { name: nom, value: "Usuari E2E Tots els rols" }
        - column: { name: nif, value: "00000008P" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }

# Les files seguents (usuari, i per a delegat/representant/auditor tambe la
# vinculacio a l'entitat E2E) es sembren nomes si la credencial de rol
# corresponent esta configurada a e2e/.env.e2e (les credencials es passen com
# a parametres de Liquibase, vegeu docker-compose.e2e.yml). Si es deixa en
# blanc (Keycloak compartit no configurat en aquest entorn), el changeSet es
# salta (onFail: MARK_RAN) en lloc de fer fallar tot el desplegament amb un
# NOT NULL/valor buit — igual que els tests Playwright ja fan "skip" quan no
# hi ha credencials (vegeu e2e/utils/env.ts, requireCredentials()).
#
# Cal una fila PBL_USUARI per a QUALSEVOL rol autenticat, Administrador
# inclos: UsuariHelper.init() (cridat a cada login, per PinbalInterceptor)
# busca sempre l'usuari per codi a PBL_USUARI i, si no el troba, intenta
# donar-lo d'alta consultant el sistema extern d'usuaris (pluginHelper /
# usuarisDS) — que en aquest entorn H2 no apunta a cap sistema real, aixi que
# aquesta consulta sempre falla i qualsevol usuari no sembrat aqui peta amb
# NotFoundException(Usuari.class) en iniciar sessio. L'administrador NO
# necessita cap PBL_ENTITAT_USUARI (els seus permisos son pel rol de Keycloak
# PBL_ADMIN, no per entitat), pero SI necessita la fila PBL_USUARI en si.
- changeSet:
    id: e2e-seed-usuari-admin
    author: Limit
    context: e2e
    preConditions:
        onFail: MARK_RAN
        not:
            changeLogPropertyDefined:
                property: e2eAdminUsername
                value: ''
    changes:
    - insert:
        tableName: pbl_usuari
        columns:
        - column: { name: codi, value: "${e2eAdminUsername}" }
        - column: { name: nom, value: "Administrador E2E" }
        - column: { name: nif, value: "00000001R" }
        - column: { name: idioma, value: ca }
        - column: { name: inicialitzat, valueNumeric: 1 }
        - column: { name: version, valueNumeric: 0 }

